spring:
 application.name: user-management-service
 profiles:
  active: dev
 security:
  oauth2:
   authorizationserver:
    issuer: http://localhost:9003/Auth
   resourceserver:
    jwt:
     issuer-uri: http://localhost:9003/Auth
   client-id: bank-web
   client-secret: secret
   redirect-uri:
   authorization-uri: /oauth2/authorize
   get.token-uri: /token
   refresh.token-uri: /refresh
   logout.token-uri: /logout 

server:
 port: 9010
 servlet:
  context-path: /User
  
internal:
 api-key: my-internal-key