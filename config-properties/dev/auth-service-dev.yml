spring:
 datasource:
  url: jdbc:postgresql://localhost:5432/bankdb
  username: bankapp
  password: LexisNexis2025!
  driver-class-name: org.postgresql.Driver
  
 security:
  oauth2:
   authorizationserver:
    issuer: http://localhost:9003
   client-id: bank-web
   client-secret: secret
   redirect-uri:
   authorization-uri: /oauth2/authorize
   token-expiration: 120
   refreshToken-expiration: 180
   read-scope: bank.read
   write-scope: bank.write
   openid-scope: openid
   profile-scope: profile
  
#================================
# logging
#================================
#Log files rotate when they reach 10 MB If Change Then Configured...
logging:
 file:
  name: D://Bank-App/logs/auth-service-dev.log
  #max-size: 1KB
  max-history: 5
 pattern:
  console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
 level:
  root: INFO
  org.springframework: INFO

  
 