spring:
 main:
  web-application-type: reactive

 cloud:
  gateway:
   default-filters:
    - TokenRelay
   server:
    webflux:
     routes:
      - id: user-service
        uri: lb://USER-MANAGEMENT-SERVICE
        predicates:
         - Path=/User/**
      - id: bank-config-service
        uri: lb://BANK-CONFIG-SERVICE
        predicates:
         - Path=/config/**
      - id: customer-service
        uri: lb://CUSTOMER-SERVICE
        predicates:
         - Path=/Customer/**
      - id: account-service
        uri: lb://ACCOUNT-SERVICE
        predicates:
         - Path=/Account/**
      - id: transaction-service
        uri: lb://TRANSACTION-SERVICE
        predicates:
         - Path=/Transaction/**
      - id: loan-service
        uri: lb://LOAN-SERVICE
        predicates:
         - Path=/Loan/**
      - id: fraud-detection-service
        uri: lb://FRAUD-DETECTION-SERVICE
        predicates:
         - Path=/Fraud-detect/**
      - id: notification-service
        uri: lb://NOTIFIATION-SERVICE
        predicates:
         - Path=/Notification/**

    
 
# ===============================
# Acutator -log Info
# ===============================
management:
 endpoints:
  web:
   base-path: /sysAdmin
   exposure:
    include: health,info,logfile,beans,heapdump
 endpoint:
  gateway:
   enabled: true
  health:
   show-details: always
