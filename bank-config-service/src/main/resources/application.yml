server:
 port: 9011
 servlet:
  context-path: /config
 
spring:
 application:
  name: bank-config-service
 profiles:
  active: dev
 security:
  oauth2:
   resourceserver:
    issuer: http://localhost:9003/Auth # http://auth-service/Auth

 rabbitmq:
  listener:
   simple:
    auto-startup: false   # prevents listener from starting too early	

logging:
 level:
  org.springframework.security: DEBUG


